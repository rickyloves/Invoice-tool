<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>发票控制台 V17.1 Aurora</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <style>
    :root {
      --primary: #0071e3;
      --bg-gradient: linear-gradient(150deg, #f2f5f9 0%, #dbeafe 100%);
      --glass: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(255, 255, 255, 0.6);
      --text-main: #1d1d1f;
      --text-sub: #6e6e73;
      --danger: #ff3b30;
      --success: #34c759;
      --blur: 40px;
    }

    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    
    body {
      background: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 120px; 
      display: flex; flex-direction: column;
    }

    .main-wrapper { 
        width: 96%; max-width: 1650px; margin: 25px auto; 
        flex: 1; 
        position: relative; 
    }
    
    .top-header { 
        margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #1d1d1f; }
    
    .version-tag { 
        font-size: 12px; font-weight: 500; color: #86868b; 
        background: rgba(0,0,0,0.04); padding: 4px 10px; border-radius: 12px;
    }

    .layout-grid { 
      display: grid; 
      grid-template-columns: 340px 1fr 340px; 
      gap: 24px; 
      position: relative; 
    }

    .col-center-wrapper {
        grid-column: 2; 
        display: flex; flex-direction: column; gap: 20px;
    }

    .col-left-placeholder { grid-column: 1; position: relative; }
    .col-left-content {
        position: absolute; top: 0; bottom: 0; left: 0; right: 0;
        display: flex; flex-direction: column; gap: 20px;
    }

    .col-right-placeholder { grid-column: 3; position: relative; }
    .col-right-content {
        position: absolute; top: 0; bottom: 0; left: 0; right: 0;
        display: flex; flex-direction: column; gap: 20px;
    }

    @media (max-width: 1200px) { 
        .layout-grid { display: flex; flex-direction: column; }
        .col-left-placeholder, .col-right-placeholder { position: static; height: auto; }
        .col-left-content, .col-right-content { position: static; }
        .col-center-wrapper { order: -1; }
        #result-output { height: auto !important; min-height: 400px; }
    }

    .glass-card {
      background: var(--glass); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.03); 
      display: flex; flex-direction: column;
      transition: transform 0.2s;
    }
    
    .card-fixed { flex-shrink: 0; }
    .card-result-anchor { height: 580px; flex-shrink: 0; display: flex; flex-direction: column; }
    .card-fill { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

    .card-title { 
        font-size: 16px; 
        font-weight: 700; color: #333; 
        margin-bottom: 12px; 
        display: flex; align-items: center; gap: 8px; flex-shrink: 0; 
    }
    .card-title::after { content: ""; flex: 1; height: 1px; background: rgba(0,0,0,0.06); margin-left: 10px; }

    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; margin-top: 12px; }
    
    .main-label {
        display: block;
        font-size: 14px;
        font-weight: 700; 
        color: var(--text-main);
        margin-bottom: 10px;
        margin-top: 20px;
    }

    input, textarea {
      width: 100%; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
      padding: 12px; font-size: 14px; background: rgba(255,255,255,0.7); 
      transition: all 0.2s ease;
    }
    input:hover, textarea:hover { border-color: rgba(0,113,227,0.4); background: rgba(255,255,255,0.9); }
    
    input:focus, textarea:focus { 
        background: #fff; 
        border-color: var(--primary); 
        outline: none; 
        box-shadow: 0 0 0 2px rgba(0,113,227,0.2); 
    }
    
    #target-input { 
        font-size: 20px;
        padding: 12px;
        font-weight: 500;
        color: var(--primary); 
    }

    #result-output {
        font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 14px; line-height: 1.7;
        background: rgba(255,255,255,0.7); padding: 25px; border-radius: 16px; 
        flex: 1; overflow-y: auto; 
        white-space: pre-wrap; border: 1px solid rgba(255,255,255,0.9); color: #333;
    }

    .inner-scroll-box { flex: 1; overflow-y: auto; padding-right: 5px; min-height: 100px; }
    
    #result-output::-webkit-scrollbar, .inner-scroll-box::-webkit-scrollbar { width: 5px; }
    #result-output::-webkit-scrollbar-thumb, .inner-scroll-box::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

    .textarea-header { resize: none; margin-bottom: 12px; height: 80px; flex-shrink: 0; }

    .flex-grid { display: flex; gap: 12px; margin-bottom: 8px; }
    .flex-grid > div { flex: 1; }

    .stat-row { display: flex; gap: 12px; margin-bottom: 0 !important; }
    .stat-box {
      flex: 1; background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5)); 
      padding: 15px; border-radius: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.8);
    }
    .stat-box b { display: block; font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
    .stat-box span { font-size: 11px; color: var(--text-sub); font-weight: 600; }

    .record-item { background: rgba(255,255,255,0.6); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.9); }
    .order-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; margin-bottom: 5px; background: rgba(255,255,255,0.8);
      border-radius: 8px; font-size: 13px;
    }
    
    button { cursor: pointer; border: none; font-weight: 600; transition: all 0.2s; font-family: inherit; }
    button:active { transform: scale(0.97); }

    .btn-action-blue { 
        background: var(--primary); color: #fff; 
        padding: 5px 12px; 
        border-radius: 8px; 
        font-size: 13px; 
        font-weight: 600;
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-batch { width: 100%; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.04); color: var(--text-sub); border-radius: 8px; font-size: 12px; }

    .glass-footer {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      width: auto; min-width: 680px; max-width: 90%;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
      padding: 12px 18px; border-radius: 24px; display: flex; gap: 12px; align-items: center; justify-content: space-between;
      box-shadow: 0 25px 60px rgba(0,0,0,0.15); z-index: 1000; border: 1px solid rgba(255,255,255,0.6);
    }
    .footer-right { display: flex; gap: 12px; }

    .footer-btn { 
        padding: 12px 22px; border-radius: 14px; font-size: 14px; white-space: nowrap;
        background: rgba(0,0,0,0.04); color: var(--text-main); display: flex; align-items: center; gap: 8px;
    }
    
    .btn-compute { 
        background: #1d1d1f; color: white !important; padding: 12px 32px; font-weight: 600;
    }
    .btn-compute:hover { background: var(--primary); transform: translateY(-1px); }

    .status-pill { 
        display: flex; align-items: center; gap: 8px; 
        font-size: 12px; font-weight: 600; color: #86868b; 
    }
    .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }

    #toast {
        position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px);
        background: rgba(29, 29, 31, 0.9); color: white; padding: 12px 28px; border-radius: 50px;
        z-index: 3000; transition: transform 0.4s;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .chip { 
        background: #fff; padding: 10px; border-radius: 10px; font-size: 12px; 
        border: 1px solid rgba(0,0,0,0.08); margin-bottom: 8px;
    }

    #loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 2000;
      display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px);
    }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(0,0,0,0.08); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="toast">操作成功</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="margin-top:20px; font-weight:600;">正在计算方案...</p>
  <p id="retry-count" style="color:var(--text-sub); font-size:13px;">...</p>
</div>

<div class="main-wrapper">
  <div class="top-header">
    <h1>发票智能计算控制台</h1>
    <span class="version-tag">V17.1 Aurora (新数据库导入)</span>
  </div>

  <div class="layout-grid">
    <div class="col-left-placeholder">
        <div class="col-left-content">
            <div class="glass-card card-fixed">
                <div class="card-title">⚙️ 开票需求配置</div>
                <label class="main-label">目标开票总额</label>
                <input id="target-input" type="number" placeholder="输入金额..." style="background:rgba(0,113,227,0.05);">
                
                <div class="flex-grid" style="margin-top:20px;">
                <div><label>起始订单</label><input id="filter-order-min" type="text"></div>
                <div><label>截止订单</label><input id="filter-order-max" type="text"></div>
                </div>
                <div class="flex-grid">
                <div><label>单笔最小</label><input id="min-single" type="number"></div>
                <div><label>单笔最大</label><input id="max-single" type="number"></div>
                </div>
                <div style="display:flex; gap:25px; margin-top:20px;">
                <label style="display:flex; align-items:center; cursor:pointer;"><input type="checkbox" id="allow-approx" style="width:16px; height:16px; margin-right:8px;"> 允许误差</label>
                <label style="display:flex; align-items:center; cursor:pointer;"><input type="checkbox" id="only-higher" style="width:16px; height:16px; margin-right:8px;"> 结果不小于目标</label>
                </div>
            </div>

            <div class="glass-card card-fill">
                <div class="card-title">📑 抬头管理</div>
                <textarea id="company-header" class="textarea-header" placeholder="粘贴抬头及税号..."></textarea>
                <div id="header-history" class="inner-scroll-box"></div>
            </div>
        </div>
    </div>

    <div class="col-center-wrapper">
      <div class="glass-card card-result-anchor">
        <div class="card-title">✨ 智能组合结果</div>
        <div id="result-output">请在左侧设置金额，点击底部“执行计算”。</div>
      </div>

      <div class="glass-card card-fixed">
        <div class="card-title">📊 实时库存状态</div>
        <div id="inventory-stats"></div>
      </div>
    </div>

    <div class="col-right-placeholder">
        <div class="col-right-content">
            <div class="glass-card card-fill">
                <div class="card-title">🗑 已删除记录</div>
                <div id="record-list" class="inner-scroll-box"></div>
            </div>

            <div class="glass-card card-fixed">
                <div class="card-title">📦 数据维护</div>
                <button id="reset-btn" class="footer-btn" style="width:100%; color:var(--danger); justify-content:center;">🔄 重置系统 (清空旧缓存)</button>
            </div>
        </div>
    </div>
  </div>
</div>

<div class="glass-footer">
  <div class="footer-left"><div class="status-pill"><div class="dot"></div> 数据已更新</div></div>
  <div class="footer-right">
    <button id="copy-btn" class="footer-btn">📋 复制方案</button>
    <button id="confirm-delete-btn" class="footer-btn hidden" style="background:var(--danger); color:white;">🗑 确认开票并移除库存</button>
    <button id="combine-btn" class="footer-btn btn-compute">✨ 执行智能计算</button>
  </div>
</div>

<script>
// --- 新数据库导入部分 ---
const DATA_SOURCE = [{"order": "1128142838302238", "amount": 1440}, {"order": "1128142838105630", "amount": 2520}, {"order": "1128142838019934", "amount": 2520}, {"order": "1128142838159518", "amount": 2520}, {"order": "1128142837859998", "amount": 2520}, {"order": "1128142838235614", "amount": 1440}, {"order": "1128142838460190", "amount": 1080}, {"order": "1128142838371166", "amount": 2520}, {"order": "1128142837920606", "amount": 2520}, {"order": "1128142838339422", "amount": 1080}, {"order": "1128142836749854", "amount": 360}, {"order": "1128142836559966", "amount": 360}, {"order": "1128142836999262", "amount": 360}, {"order": "1128142837895198", "amount": 360}, {"order": "1128142836480542", "amount": 360}, {"order": "1128142836783902", "amount": 360}, {"order": "1128142836650782", "amount": 360}, {"order": "1128142836814622", "amount": 360}, {"order": "1128142835729374", "amount": 1800}, {"order": "1128142835329438", "amount": 1800}, {"order": "1128142835552286", "amount": 1800}, {"order": "1128142834945374", "amount": 1800}, {"order": "1128142835443230", "amount": 1800}, {"order": "1128142835324126", "amount": 1800}, {"order": "1128142835317726", "amount": 1800}, {"order": "1128142835443166", "amount": 1797}, {"order": "1128142834696350", "amount": 1077}, {"order": "1128142834683614", "amount": 1077}, {"order": "1128142835305310", "amount": 1077}, {"order": "1128142835302494", "amount": 1077}, {"order": "1128142834518302", "amount": 1080}, {"order": "1128142834570270", "amount": 1077}, {"order": "1128142834513502", "amount": 1062}, {"order": "36048358558", "amount": 957}, {"order": "28653912542", "amount": 3090}, {"order": "28596717342", "amount": 1030}, {"order": "27442276894", "amount": 990}, {"order": "27348789470", "amount": 1015}, {"order": "26454001438", "amount": 1040}, {"order": "26427577502", "amount": 1040}, {"order": "26415071774", "amount": 4160}, {"order": "25198206302", "amount": 5050}, {"order": "25107660382", "amount": 1010}, {"order": "25107628958", "amount": 3030}, {"order": "25080098910", "amount": 980}, {"order": "25079622366", "amount": 980}, {"order": "24774571806", "amount": 920}, {"order": "17695521054", "amount": 380}, {"order": "17695520350", "amount": 2080}, {"order": "17695434270", "amount": 2080}];

let inventory = [];
let deleteRecords = JSON.parse(localStorage.getItem('deleteRecords_V17_1') || '[]');

const saveInventory = () => {
    localStorage.setItem('invoiceInventory_V17_1', JSON.stringify(inventory));
    renderStats();
};

function normalize(raw) {
    const map = new Map();
    (raw || []).forEach(o => {
        const k = o.order + '|' + o.amount;
        if (!map.has(k)) map.set(k, { order: String(o.order), amount: Math.round(Number(o.amount)) });
    });
    return Array.from(map.values());
}

async function loadInventory(forceReset = false) {
    if (!forceReset) {
        const local = JSON.parse(localStorage.getItem('invoiceInventory_V17_1'));
        if (local && local.length > 0) { inventory = normalize(local); renderStats(); return; }
    }
    inventory = normalize(DATA_SOURCE);
    saveInventory();
    if (forceReset) { deleteRecords = []; localStorage.setItem('deleteRecords_V17_1', '[]'); renderDeleteRecords(); }
}

function renderStats() {
    const el = document.getElementById('inventory-stats');
    const total = inventory.reduce((a, b) => a + b.amount, 0);
    el.innerHTML = `<div class="stat-row"><div class="stat-box"><b>${total.toLocaleString()}</b><span>库存总额</span></div><div class="stat-box"><b>${inventory.length}</b><span>单数</span></div></div>`;
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function renderDeleteRecords() {
    const list = document.getElementById('record-list'); list.innerHTML = '';
    if (deleteRecords.length === 0) list.innerHTML = '<div style="color:#999;text-align:center;padding:20px;">无历史记录</div>';
    deleteRecords.slice(0, 10).forEach((batch, idx) => {
        const item = document.createElement('div'); item.className = 'record-item';
        item.innerHTML = `批次 ${idx+1} <button class="btn-action-blue" onclick="recoverBatch(${idx})">恢复</button>`;
        list.appendChild(item);
    });
}

window.recoverBatch = (idx) => {
    const batch = deleteRecords.splice(idx, 1)[0];
    batch.forEach(inv => inv.orders.forEach(o => inventory.push(o)));
    inventory = normalize(inventory); saveInventory(); renderDeleteRecords(); showToast('已恢复');
};

// 简化版计算逻辑
document.getElementById('combine-btn').onclick = async () => {
    const tgt = +document.getElementById('target-input').value;
    if (!tgt) return alert('请输入目标');
    document.getElementById('loading-overlay').style.display = 'flex';
    
    setTimeout(() => {
        // 使用简单的贪心+随机凑数逻辑
        let pool = [...inventory].sort(() => Math.random() - 0.5);
        let selected = [], sum = 0;
        for (let o of pool) {
            if (sum + o.amount <= tgt) { sum += o.amount; selected.push(o); }
        }
        
        document.getElementById('loading-overlay').style.display = 'none';
        const outEl = document.getElementById('result-output');
        if (selected.length === 0) { outEl.textContent = '未找到匹配方案'; }
        else {
            let txt = `组合总额：${sum} 元\n\n`;
            selected.forEach(o => txt += `订单：${o.order} | 金额：${o.amount}\n`);
            outEl.textContent = txt;
            window.lastPick = selected;
            document.getElementById('confirm-delete-btn').classList.remove('hidden');
        }
    }, 500);
};

document.getElementById('confirm-delete-btn').onclick = () => {
    const keys = new Set(window.lastPick.map(o => o.order + '|' + o.amount));
    inventory = inventory.filter(o => !keys.has(o.order + '|' + o.amount));
    deleteRecords.unshift([{orders: window.lastPick}]);
    localStorage.setItem('deleteRecords_V17_1', JSON.stringify(deleteRecords));
    saveInventory(); renderDeleteRecords();
    document.getElementById('confirm-delete-btn').classList.add('hidden');
    showToast('已移除库存');
};

document.getElementById('reset-btn').onclick = () => {
    if(confirm('确定重置并加载最新数据库？这会清空你之前的开票历史。')) loadInventory(true);
};

document.getElementById('copy-btn').onclick = () => {
    navigator.clipboard.writeText(document.getElementById('result-output').textContent);
    showToast('已复制');
};

loadInventory();
</script>
</body>
</html>
